<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>قدورة | اطلب أكلتك</title>
<meta name="description" content="مطعم قدورة - اطلب أكلتك المفضلة بسهولة">
<style>
*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial,sans-serif;background:#faf7f2;color:#222}
:root{--main:#b51f24;--dark:#171717;--gold:#e8a52b;--light:#fff;--muted:#777}
header{position:sticky;top:0;z-index:50;background:#171717;color:#fff;box-shadow:0 2px 12px #0002}
.top{max-width:1200px;margin:auto;padding:15px 18px;display:flex;align-items:center;justify-content:space-between;gap:15px}
.logo{font-size:28px;font-weight:900;color:#fff}.logo span{color:var(--gold)}
.cart-btn{border:0;background:var(--main);color:#fff;padding:11px 17px;border-radius:12px;font-weight:bold;cursor:pointer}
#cartCount{background:#fff;color:var(--main);padding:2px 7px;border-radius:20px;margin-right:5px}
.hero{background:linear-gradient(135deg,#171717,#3a1113);color:#fff;text-align:center;padding:50px 20px}
.hero h1{font-size:42px;margin:0 0 10px}.hero p{font-size:18px;color:#ddd;margin:0}
.search{max-width:650px;margin:25px auto 0;display:flex}.search input{width:100%;padding:15px;border-radius:12px;border:0;font-size:16px}
.categories{max-width:1200px;margin:20px auto;padding:0 15px;display:flex;gap:10px;overflow:auto}
.cat{white-space:nowrap;border:1px solid #ddd;background:#fff;padding:11px 17px;border-radius:25px;cursor:pointer;font-weight:bold}.cat.active,.cat:hover{background:var(--main);color:#fff;border-color:var(--main)}
main{max-width:1200px;margin:auto;padding:10px 15px 100px}.section-title{display:flex;align-items:center;justify-content:space-between;margin:30px 0 15px}.section-title h2{margin:0;font-size:25px}.section-title small{color:var(--muted)}
.subcat{margin:25px 0 12px;padding-right:10px;border-right:5px solid var(--main);font-size:21px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:15px}
.card{background:#fff;border-radius:16px;padding:15px;box-shadow:0 3px 14px #0000000d;border:1px solid #eee}
.card h3{margin:0 0 8px;font-size:18px}.desc{font-size:13px;color:#777;min-height:18px;margin-bottom:10px}
.price-row{display:flex;align-items:center;justify-content:space-between;gap:8px}.price{font-weight:900;color:var(--main)}
.add{border:0;background:var(--dark);color:#fff;padding:9px 13px;border-radius:9px;cursor:pointer}.add:hover{background:var(--main)}
.sizes{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}.size-btn{border:1px solid #ddd;background:#fafafa;padding:7px 3px;border-radius:8px;cursor:pointer;font-size:12px}.size-btn:hover{border-color:var(--main);color:var(--main)}
.empty{background:#fff;padding:25px;border-radius:15px;text-align:center;color:#777}
.notice{background:#fff7df;border:1px solid #f0d17c;padding:14px;border-radius:12px;margin:15px 0;color:#664d00}
.overlay{display:none;position:fixed;inset:0;background:#0008;z-index:100;align-items:flex-end;justify-content:center}.overlay.show{display:flex}
.panel{background:#fff;width:min(650px,100%);max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:20px}
.panel-head{display:flex;justify-content:space-between;align-items:center}.close{border:0;background:#eee;border-radius:50%;width:36px;height:36px;cursor:pointer}
.cart-item{display:grid;grid-template-columns:1fr auto;gap:10px;border-bottom:1px solid #eee;padding:13px 0}.qty{display:flex;align-items:center;gap:7px}.qty button{border:0;width:30px;height:30px;border-radius:8px;cursor:pointer}
.total{font-size:20px;font-weight:900;display:flex;justify-content:space-between;padding:18px 0}.checkout{width:100%;padding:14px;border:0;background:var(--main);color:#fff;font-size:17px;font-weight:bold;border-radius:12px;cursor:pointer}
form label{display:block;font-weight:bold;margin:12px 0 6px}form input,form select,form textarea{width:100%;padding:12px;border:1px solid #ddd;border-radius:10px;font-size:15px}form textarea{min-height:80px;resize:vertical}
footer{background:#171717;color:#fff;text-align:center;padding:30px 15px}.wa{color:#61df82}
.toast{position:fixed;bottom:20px;left:20px;background:#171717;color:#fff;padding:12px 17px;border-radius:10px;display:none;z-index:200}.toast.show{display:block}
@media(max-width:600px){.hero h1{font-size:32px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.card{padding:11px}.card h3{font-size:15px}.top{padding:11px 12px}.logo{font-size:23px}.cat{padding:9px 13px}}
</style>
</head>
<body>

<header>
  <div class="top">
    <div class="logo">قدورة <span>🍽️</span></div>
    <button class="cart-btn" onclick="openCart()">🛒 السلة <span id="cartCount">0</span></button>
  </div>
</header>

<section class="hero">
  <h1>أهلاً بيك في قدورة ❤️</h1>
  <p>اختار أكلك، ضيفه للسلة، وابعت طلبك على واتساب بسهولة</p>
  <div class="search"><input id="search" oninput="render()" placeholder="🔎 ابحث عن أكلة..."></div>
</section>

<nav class="categories" id="categories"></nav>

<main id="menu"></main>

<footer>
  <h2>قدورة 🍽️</h2>
  <p>أكلتك المفضلة لحد باب البيت</p>
  <p class="wa">📱 الطلبات عبر واتساب</p>
</footer>

<div class="overlay" id="cartOverlay" onclick="closeOutside(event,'cartOverlay')">
  <div class="panel">
    <div class="panel-head"><h2>🛒 سلة المشتريات</h2><button class="close" onclick="closeCart()">×</button></div>
    <div id="cartItems"></div>
    <div id="cartSummary"></div>
  </div>
</div>

<div class="overlay" id="checkoutOverlay" onclick="closeOutside(event,'checkoutOverlay')">
  <div class="panel">
    <div class="panel-head"><h2>📦 بيانات الطلب</h2><button class="close" onclick="closeCheckout()">×</button></div>
    <div class="notice">مصاريف التوصيل حاليًا 0 جنيه لكل المناطق، ويمكن تعديلها لاحقًا من الكود.</div>
    <form id="checkoutForm" onsubmit="sendOrder(event)">
      <label>الاسم *</label><input id="customerName" required>
      <label>رقم الموبايل *</label><input id="customerPhone" type="tel" required>
      <label>منطقة التوصيل *</label>
      <select id="area" required></select>
      <label>العنوان بالتفصيل *</label><textarea id="address" required placeholder="الشارع، العمارة، الدور، الشقة..."></textarea>
      <label>ملاحظات</label><textarea id="notes" placeholder="أي ملاحظات على الطلب"></textarea>
      <div id="checkoutTotal" class="total"></div>
      <button class="checkout" type="submit">تأكيد الطلب وإرساله على واتساب</button>
    </form>
  </div>
</div>

<div class="toast" id="toast"></div>

let cart = [];

function money(n){return `${Number(n).toLocaleString('ar-EG')} جنيه`}

function init(){
  const cats=document.getElementById("categories");
  cats.innerHTML=menu.map((m,i)=>`<button class="cat ${i===0?'active':''}" onclick="selectSection(${i},this)">${m.section}</button>`).join("");
  document.getElementById("area").innerHTML=DELIVERY_AREAS.map(a=>`<option value="${a.name}" data-fee="${a.fee}" ${a.disabled?'disabled':''}>${a.name}${!a.disabled?' — '+money(a.fee):''}</option>`).join("");
  render();
}

let currentSection=0;
function selectSection(i,el){
  currentSection=i;
  document.querySelectorAll(".cat").forEach(x=>x.classList.remove("active"));el.classList.add("active");
  document.getElementById("search").value="";
  render();
  window.scrollTo({top:document.querySelector("main").offsetTop-70,behavior:"smooth"});
}

function render(){
  const q=document.getElementById("search").value.trim().toLowerCase();
  const sections=q ? menu : [menu[currentSection]];
  let html="";
  sections.forEach(section=>{
    let groupsHtml="";
    section.groups.forEach(group=>{
      const items=group.items.filter(x=>!q || x[0].toLowerCase().includes(q) || (x[2]||"").toLowerCase().includes(q));
      if(!items.length)return;
      groupsHtml+=`<h3 class="subcat">${group.name}</h3><div class="grid">`;
      items.forEach(item=>{groupsHtml+=card(item,section.section,group.name)});
      groupsHtml+="</div>";
    });
    if(groupsHtml) html+=`<div class="section-title"><h2>${section.section}</h2><small>${section.groups.reduce((a,g)=>a+g.items.length,0)} صنف</small></div>${groupsHtml}`;
  });
  document.getElementById("menu").innerHTML=html||`<div class="empty">مفيش نتيجة للبحث 🔎</div>`;
}

function card(item,section,group){
  const [name,prices,desc]=item;
  if(Array.isArray(prices)){
    const labels=prices.length===3?["صغير","وسط","كبير"]:["صغير","كبير"];
    return `<article class="card"><h3>${name}</h3><div class="desc">${desc||''}</div><div class="sizes">
      ${prices.map((p,i)=>`<button class="size-btn" onclick="addItem('${esc(name)} - ${labels[i]}','${esc(section)}','${esc(group)}',${p})">${labels[i]}<br><b>${money(p)}</b></button>`).join("")}
    </div></article>`;
  }
  return `<article class="card"><h3>${name}</h3><div class="desc">${desc||''}</div><div class="price-row"><span class="price">${money(prices)}</span><button class="add" onclick="addItem('${esc(name)}','${esc(section)}','${esc(group)}',${prices})">+ أضف</button></div></article>`;
}
function esc(s){return String(s).replace(/\\/g,"\\\\").replace(/'/g,"\\'")}

function addItem(name,section,group,price){
  const existing=cart.find(x=>x.name===name);
  if(existing) existing.qty++;
  else cart.push({name,section,group,price,qty:1});
  updateCart();toast("تمت إضافة "+name+" للسلة ✅");
}
function updateCart(){
  document.getElementById("cartCount").textContent=cart.reduce((a,x)=>a+x.qty,0);
}
function cartTotal(){return cart.reduce((a,x)=>a+x.price*x.qty,0)}
function openCart(){renderCart();document.getElementById("cartOverlay").classList.add("show")}
function closeCart(){document.getElementById("cartOverlay").classList.remove("show")}
function renderCart(){
  const box=document.getElementById("cartItems");
  if(!cart.length){box.innerHTML='<div class="empty">السلة فاضية 😄<br>اختار أكلك الأول.</div>';document.getElementById("cartSummary").innerHTML="";return}
  box.innerHTML=cart.map((x,i)=>`<div class="cart-item"><div><b>${x.name}</b><br><small>${money(x.price)} × ${x.qty} = ${money(x.price*x.qty)}</small></div>
    <div class="qty"><button onclick="changeQty(${i},-1)">−</button><b>${x.qty}</b><button onclick="changeQty(${i},1)">+</button><button onclick="removeItem(${i})">🗑️</button></div></div>`).join("");
  document.getElementById("cartSummary").innerHTML=`<div class="total"><span>الإجمالي</span><span>${money(cartTotal())}</span></div><button class="checkout" onclick="openCheckout()">إتمام الطلب</button>`;
}
function changeQty(i,n){cart[i].qty+=n;if(cart[i].qty<=0)cart.splice(i,1);updateCart();renderCart()}
function removeItem(i){cart.splice(i,1);updateCart();renderCart()}
function openCheckout(){
  if(!cart.length){toast("السلة فاضية");return}
  closeCart();updateCheckoutTotal();document.getElementById("checkoutOverlay").classList.add("show")
}
function closeCheckout(){document.getElementById("checkoutOverlay").classList.remove("show")}
function updateCheckoutTotal(){
  const fee=Number(document.getElementById("area").selectedOptions[0]?.dataset.fee||0);
  document.getElementById("checkoutTotal").innerHTML=`<span>الإجمالي النهائي</span><span>${money(cartTotal()+fee)}</span>`;
}
document.getElementById("area").addEventListener("change",updateCheckoutTotal);

function sendOrder(e){
  e.preventDefault();
  if(!cart.length)return;
  const name=document.getElementById("customerName").value.trim();
  const phone=document.getElementById("customerPhone").value.trim();
  const area=document.getElementById("area").value;
  const areaFee=Number(document.getElementById("area").selectedOptions[0].dataset.fee||0);
  const address=document.getElementById("address").value.trim();
  const notes=document.getElementById("notes").value.trim();
  const lines=cart.map((x,i)=>`${i+1}. ${x.name} × ${x.qty} = ${x.price*x.qty} جنيه`).join("\n");
  const total=cartTotal()+areaFee;
  const msg=`🟢 *طلب جديد من موقع قدورة*\n\n👤 الاسم: ${name}\n📱 الهاتف: ${phone}\n📍 المنطقة: ${area}\n🏠 العنوان: ${address}\n\n🛒 *تفاصيل الطلب:*\n${lines}\n\n💵 قيمة الطلب: ${cartTotal()} جنيه\n🚚 التوصيل: ${areaFee} جنيه\n💰 *الإجمالي النهائي: ${total} جنيه*\n\n📝 ملاحظات: ${notes||"لا يوجد"}`;
  if(WHATSAPP_NUMBER==="201000000000"){alert("ضع رقم واتساب المطعم في متغير WHATSAPP_NUMBER داخل الكود أولًا.");return}
  window.open(`https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(msg)}`,"_blank");
}

function closeOutside(e,id){if(e.target.id===id)document.getElementById(id).classList.remove("show")}
function toast(t){const x=document.getElementById("toast");x.textContent=t;x.classList.add("show");setTimeout(()=>x.classList.remove("show"),1800)}
init();
</script>
